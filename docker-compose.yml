# Docker Compose for SyllabusMCP Distributed Services

services:
  # Syllabus parsing service (MCP server with sampling)
  syllabus-service:
    build:
      context: .
      dockerfile: services/syllabus_service/Dockerfile
    container_name: syllabus-service
    ports:
      - "8601:8601"
    volumes:
      # Mount PDFs directory if you have local PDF files to process
      - ./pdfs:/app/pdfs:ro
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import socket; s=socket.socket(); s.connect((\"localhost\",8601)); s.close()' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - syllabus-network

  # Academic planning service (MCP server with sampling)
  academic-planner-service:
    build:
      context: .
      dockerfile: services/academic_planner_service/Dockerfile
    container_name: academic-planner-service
    ports:
      - "8602:8602"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import socket; s=socket.socket(); s.connect((\"localhost\",8602)); s.close()' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - syllabus-network

  # Productivity service (calendar/reminders)
  productivity-service:
    build:
      context: .
      dockerfile: services/productivity_service/Dockerfile
    container_name: productivity-service
    ports:
      - "8603:8603"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import socket; s=socket.socket(); s.connect((\"localhost\",8603)); s.close()' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - syllabus-network


networks:
  syllabus-network:
    driver: bridge
    name: syllabus-distributed-network

volumes:
  # Optional: persistent storage for productivity service data
  productivity-data:
    driver: local